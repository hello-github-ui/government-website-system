<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/layout :: head(title='管理员编辑')}"></head>
<body>
<div th:insert="~{admin/fragments/layout :: aside}"></div>
<div class="admin-main">
    <div th:insert="~{admin/fragments/layout :: topbar(title='管理员编辑')}"></div>
    <div class="admin-content">
        <div class="card shadow-sm"><div class="card-body">
            <form th:action="${info != null} ? @{/admin/admin/edit/{id}(id=${info.id})} : @{/admin/admin/add}" method="post">
                <div class="row">
                    <div class="col-md-6 mb-3"><label class="form-label">用户名 *</label>
                        <input name="username" class="form-control" th:value="${info?.username}"
                               th:readonly="${info != null}" required></div>
                    <div class="col-md-6 mb-3"><label class="form-label">姓名 *</label>
                        <input name="name" class="form-control" th:value="${info?.name}" required></div>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3"><label class="form-label">邮箱</label>
                        <input name="email" class="form-control" th:value="${info?.email}"></div>
                    <div class="col-md-6 mb-3"><label class="form-label">手机号</label>
                        <input name="phone" class="form-control" th:value="${info?.phone}"></div>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3"><label class="form-label">角色ID</label>
                        <input name="role_id" type="number" class="form-control" th:value="${info?.roleId} ?: 1"></div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">密码（留空不修改）</label>
                        <input type="password" name="password" class="form-control"></div>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3"><label class="form-label">超级管理员</label>
                        <select name="isSuper" class="form-select">
                            <option value="0" th:selected="${info == null || info.isSuper == 0}">否</option>
                            <option value="1" th:selected="${info != null && info.isSuper == 1}">是</option>
                        </select></div>
                    <div class="col-md-6 mb-3"><label class="form-label">状态</label>
                        <select name="status" class="form-select">
                            <option value="1" th:selected="${info == null || info.status == 1}">启用</option>
                            <option value="0" th:selected="${info != null && info.status == 0}">禁用</option>
                        </select></div>
                </div>
                <button class="btn btn-danger">保存</button>
                <a th:href="@{/admin/admin}" class="btn btn-outline-secondary">返回</a>
            </form>
        </div></div>
    </div>
</div>
</body>
</html>
