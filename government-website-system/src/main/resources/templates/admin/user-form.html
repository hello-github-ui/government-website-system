<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/layout :: head(title='用户编辑')}"></head>
<body>
<div th:insert="~{admin/fragments/layout :: aside}"></div>
<div class="admin-main">
    <div th:insert="~{admin/fragments/layout :: topbar(title='用户编辑')}"></div>
    <div class="admin-content">
        <div class="card shadow-sm"><div class="card-body">
            <form th:action="${info != null} ? @{/admin/user/edit/{id}(id=${info.id})} : @{/admin/user/add}" method="post">
                <div class="mb-3"><label class="form-label">用户名 *</label>
                    <input name="username" class="form-control" th:value="${info?.username}"
                           th:readonly="${info != null}" required></div>
                <div class="mb-3"><label class="form-label">真实姓名</label>
                    <input name="real_name" class="form-control" th:value="${info?.realName}"></div>
                <div class="row">
                    <div class="col-md-6 mb-3"><label class="form-label">手机号</label>
                        <input name="phone" class="form-control" th:value="${info?.phone}"></div>
                    <div class="col-md-6 mb-3"><label class="form-label">邮箱</label>
                        <input name="email" class="form-control" th:value="${info?.email}"></div>
                </div>
                <div class="mb-3"><label class="form-label">新密码（留空不修改）</label>
                    <input type="password" name="password" class="form-control"></div>
                <div class="mb-3"><label class="form-label">状态</label>
                    <select name="status" class="form-select">
                        <option value="1" th:selected="${info == null || info.status == 1}">正常</option>
                        <option value="0" th:selected="${info != null && info.status == 0}">禁用</option>
                    </select></div>
                <button class="btn btn-danger">保存</button>
                <a th:href="@{/admin/user}" class="btn btn-outline-secondary">返回</a>
            </form>
        </div></div>
    </div>
</div>
</body>
</html>
