<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/layout :: head(title='咨询管理')}"></head>
<body>
<div th:insert="~{admin/fragments/layout :: aside}"></div>
<div class="admin-main">
    <div th:insert="~{admin/fragments/layout :: topbar(title='咨询管理')}"></div>
    <div class="admin-content">
        <div class="card shadow-sm">
            <div class="card-header bg-white">
                <div class="btn-group btn-group-sm">
                    <a th:href="@{/admin/consult}" class="btn btn-outline-secondary">全部</a>
                    <a th:href="@{/admin/consult(status=0)}" class="btn btn-outline-secondary">待处理</a>
                    <a th:href="@{/admin/consult(status=2)}" class="btn btn-outline-secondary">已回复</a>
                </div>
            </div>
            <table class="table table-hover mb-0">
                <thead class="table-light"><tr><th>ID</th><th>标题</th><th>类型</th><th>状态</th><th>提交时间</th><th>操作</th></tr></thead>
                <tbody>
                <tr th:each="c : ${list}">
                    <td th:text="${c.id}"></td>
                    <td th:text="${c.title}"></td>
                    <td>
                        <span th:if="${c.type==1}">咨询</span>
                        <span th:if="${c.type==2}">投诉</span>
                        <span th:if="${c.type==3}">建议</span>
                    </td>
                    <td>
                        <span th:if="${c.status==0}" class="badge bg-secondary">待处理</span>
                        <span th:if="${c.status==1}" class="badge bg-info">处理中</span>
                        <span th:if="${c.status==2}" class="badge bg-success">已回复</span>
                    </td>
                    <td th:text="${#temporals.format(c.createTime,'yyyy-MM-dd')}"></td>
                    <td><a th:href="@{/admin/consult/view/{id}(id=${c.id})}" class="btn btn-sm btn-outline-primary">处理</a></td>
                </tr>
                <tr th:if="${#lists.isEmpty(list)}"><td colspan="6" class="text-center text-muted py-4">暂无数据</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
