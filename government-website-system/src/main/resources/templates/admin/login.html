<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台登录</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg,#7f1d1d,#b91c1d); height:100vh; }
        .login-box { max-width:400px; margin:8% auto; }
    </style>
</head>
<body>
<div class="container">
    <div class="login-box">
        <div th:if="${frontNotice != null}" class="alert alert-warning" th:text="${frontNotice}"></div>
        <div th:if="${flashError != null}" class="alert alert-danger" th:text="${flashError}"></div>
        <div th:if="${flashMessage != null}" class="alert alert-success" th:text="${flashMessage}"></div>
        <div class="card shadow">
            <div class="card-body p-4">
                <h4 class="text-center mb-4"><i class="fas fa-shield-alt text-danger"></i> 政府官网后台</h4>
                <form th:action="@{/admin/login/doLogin}" method="post">
                    <div class="mb-3"><label class="form-label">管理员账号</label>
                        <input name="username" class="form-control" required autofocus></div>
                    <div class="mb-3"><label class="form-label">密码</label>
                        <input type="password" name="password" class="form-control" required></div>
                    <button class="btn btn-danger w-100">登 录</button>
                </form>
                <div class="text-center mt-3">
                    <a th:href="@{/}" class="text-muted small">返回前台</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
