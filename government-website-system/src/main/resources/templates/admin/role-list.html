<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/layout :: head(title='角色权限')}"></head>
<body>
<div th:insert="~{admin/fragments/layout :: aside}"></div>
<div class="admin-main">
    <div th:insert="~{admin/fragments/layout :: topbar(title='角色权限')}"></div>
    <div class="admin-content">
        <div class="card shadow-sm">
            <div class="card-header bg-white d-flex justify-content-between">
                <span>角色列表</span>
                <a th:href="@{/admin/role/add}" class="btn btn-danger btn-sm"><i class="fas fa-plus"></i> 添加角色</a>
            </div>
            <table class="table table-hover mb-0">
                <thead class="table-light"><tr><th>ID</th><th>角色名称</th><th>描述</th><th>状态</th><th>操作</th></tr></thead>
                <tbody>
                <tr th:each="r : ${roles}">
                    <td th:text="${r.id}"></td>
                    <td th:text="${r.roleName}"></td>
                    <td th:text="${r.roleDesc}"></td>
                    <td>
                        <span th:if="${r.status==1}" class="badge bg-success">启用</span>
                        <span th:if="${r.status==0}" class="badge bg-danger">禁用</span>
                    </td>
                    <td>
                        <a th:href="@{/admin/role/edit/{id}(id=${r.id})}" class="btn btn-sm btn-outline-primary">编辑</a>
                        <form th:action="@{/admin/role/delete}" method="post" style="display:inline" onsubmit="return confirm('确认删除？')">
                            <input type="hidden" name="id" th:value="${r.id}">
                            <button class="btn btn-sm btn-outline-danger">删除</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
