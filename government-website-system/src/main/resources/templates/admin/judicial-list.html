<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/layout :: head(title='裁判文书')}"></head>
<body>
<div th:insert="~{admin/fragments/layout :: aside}"></div>
<div class="admin-main">
    <div th:insert="~{admin/fragments/layout :: topbar(title='裁判文书')}"></div>
    <div class="admin-content">
        <div class="card shadow-sm">
            <div class="card-header bg-white d-flex justify-content-between">
                <span>文书列表（共 <b th:text="${total}"></b> 条）</span>
                <a th:href="@{/admin/judicial/add}" class="btn btn-danger btn-sm"><i class="fas fa-plus"></i> 新增文书</a>
            </div>
            <table class="table table-hover mb-0">
                <thead class="table-light"><tr><th>案号</th><th>案件名称</th><th>法院</th><th>审核</th><th>操作</th></tr></thead>
                <tbody>
                <tr th:each="j : ${list}">
                    <td th:text="${j.caseNo}"></td>
                    <td th:text="${j.caseName}"></td>
                    <td th:text="${j.court}"></td>
                    <td>
                        <span th:if="${j.checkStatus==1}" class="badge bg-success">已通过</span>
                        <span th:if="${j.checkStatus==0}" class="badge bg-warning text-dark">待审</span>
                        <span th:if="${j.checkStatus==2}" class="badge bg-danger">已驳回</span>
                    </td>
                    <td>
                        <a th:href="@{/admin/judicial/edit/{id}(id=${j.id})}" class="btn btn-sm btn-outline-primary">编辑</a>
                        <form autocomplete="off" th:action="@{/admin/judicial/delete}" method="post" style="display:inline" onsubmit="return confirm('确认删除？')">
                            <input autocomplete="off" type="hidden" name="id" th:value="${j.id}">
                            <button class="btn btn-sm btn-outline-danger">删除</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(list)}"><td colspan="5" class="text-center text-muted py-4">暂无数据</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
