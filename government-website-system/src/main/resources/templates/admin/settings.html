<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/layout :: head(title='系统设置')}"></head>
<body>
<div th:insert="~{admin/fragments/layout :: aside}"></div>
<div class="admin-main">
    <div th:insert="~{admin/fragments/layout :: topbar(title='系统设置')}"></div>
    <div class="admin-content">
        <div th:if="${flashError != null}" class="alert alert-danger" th:text="${flashError}"></div>
        <div th:if="${flashMessage != null}" class="alert alert-success" th:text="${flashMessage}"></div>

        <div class="card shadow-sm mb-3"><div class="card-body">
            <form th:action="@{/admin/settings/save}" method="post">
                <h6 class="text-danger"><i class="fas fa-cog"></i> 基础设置</h6>
                <div class="row">
                    <div class="col-md-6 mb-3"><label class="form-label">网站标题</label>
                        <input name="site_title" class="form-control" th:value="${config['site_title']}"></div>
                    <div class="col-md-6 mb-3"><label class="form-label">网站副标题</label>
                        <input name="site_subtitle" class="form-control" th:value="${config['site_subtitle']}"></div>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3"><label class="form-label">网站地址</label>
                        <input name="site_url" class="form-control" th:value="${config['site_url']}"></div>
                    <div class="col-md-6 mb-3"><label class="form-label">网站 Logo</label>
                        <input name="site_logo" class="form-control" th:value="${config['site_logo']}"></div>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3"><label class="form-label">联系电话</label>
                        <input name="contact_phone" class="form-control" th:value="${config['contact_phone']}"></div>
                    <div class="col-md-6 mb-3"><label class="form-label">联系邮箱</label>
                        <input name="contact_email" class="form-control" th:value="${config['contact_email']}"></div>
                </div>
                <div class="mb-3"><label class="form-label">联系地址</label>
                    <input name="contact_address" class="form-control" th:value="${config['contact_address']}"></div>
                <div class="mb-3"><label class="form-label">工作时间</label>
                    <input name="contact_work_time" class="form-control" th:value="${config['contact_work_time']}"></div>
                <hr>
                <h6 class="text-danger"><i class="fas fa-search"></i> SEO 设置</h6>
                <div class="mb-3"><label class="form-label">SEO 关键词</label>
                    <input name="seo_keywords" class="form-control" th:value="${config['seo_keywords']}"></div>
                <div class="mb-3"><label class="form-label">SEO 描述</label>
                    <textarea name="seo_description" rows="2" class="form-control" th:text="${config['seo_description']}"></textarea></div>
                <hr>
                <h6 class="text-danger"><i class="fas fa-certificate"></i> 备案信息</h6>
                <div class="row">
                    <div class="col-md-6 mb-3"><label class="form-label">ICP 备案号</label>
                        <input name="icp_number" class="form-control" th:value="${config['icp_number']}"></div>
                    <div class="col-md-6 mb-3"><label class="form-label">公安备案号</label>
                        <input name="police_number" class="form-control" th:value="${config['police_number']}"></div>
                </div>
                <div class="mb-3"><label class="form-label">版权信息</label>
                    <input name="copyright" class="form-control" th:value="${config['copyright']}"></div>
                <button class="btn btn-danger">保存设置</button>
            </form>
            <form th:action="@{/admin/settings/clearCache}" method="post" class="d-inline">
                <button class="btn btn-outline-warning">清除缓存</button>
            </form>
        </div></div>

        <div class="card shadow-sm"><div class="card-body">
            <h6 class="text-danger"><i class="fas fa-envelope"></i> SMTP 邮件配置（阿里云企业邮箱等）</h6>
            <form th:action="@{/admin/settings/save}" method="post">
                <div class="row">
                    <div class="col-md-6 mb-3"><label class="form-label">SMTP 服务器</label>
                        <input name="smtp_host" class="form-control" placeholder="smtp.qiye.aliyun.com" th:value="${config['smtp_host']}"></div>
                    <div class="col-md-3 mb-3"><label class="form-label">端口</label>
                        <input name="smtp_port" class="form-control" placeholder="465" th:value="${config['smtp_port']} ?: '465'"></div>
                    <div class="col-md-3 mb-3"><label class="form-label">加密方式</label>
                        <select name="smtp_secure" class="form-select">
                            <option value="ssl" th:selected="${config['smtp_secure'] == null || config['smtp_secure'] == 'ssl'}">SSL</option>
                            <option value="tls" th:selected="${config['smtp_secure'] == 'tls'}">TLS</option>
                            <option value="none" th:selected="${config['smtp_secure'] == 'none'}">无</option>
                        </select></div>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3"><label class="form-label">发件邮箱账号</label>
                        <input name="smtp_user" class="form-control" placeholder="admin@example.com" th:value="${config['smtp_user']}"></div>
                    <div class="col-md-6 mb-3"><label class="form-label">SMTP 授权码/密码</label>
                        <input type="password" name="smtp_pass" class="form-control" placeholder="授权码" th:value="${config['smtp_pass']}"></div>
                </div>
                <div class="mb-3"><label class="form-label">发件人显示地址（From）</label>
                    <input name="smtp_from" class="form-control" placeholder="不填则使用发件邮箱账号" th:value="${config['smtp_from']}"></div>
                <button class="btn btn-danger">保存 SMTP 配置</button>
            </form>
            <form th:action="@{/admin/settings/sendTestMail}" method="post" class="mt-3">
                <div class="input-group">
                    <input name="testEmail" type="email" class="form-control" placeholder="输入接收测试邮件的邮箱" required>
                    <button class="btn btn-outline-primary"><i class="fas fa-paper-plane"></i> 发送测试邮件</button>
                </div>
                <div class="form-text">发送测试邮件需要服务器可访问外网 SMTP 端口，请先保存配置再测试。</div>
            </form>
        </div></div>
    </div>
</div>
</body>
</html>
