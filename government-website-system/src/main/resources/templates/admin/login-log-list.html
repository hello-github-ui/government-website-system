<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/layout :: head(title='登录日志')}"></head>
<body>
<div th:insert="~{admin/fragments/layout :: aside}"></div>
<div class="admin-main">
    <div th:insert="~{admin/fragments/layout :: topbar(title='登录日志')}"></div>
    <div class="admin-content">
        <div class="card shadow-sm">
            <div class="card-header bg-white d-flex justify-content-between align-items-center flex-wrap">
                <div class="btn-group btn-group-sm">
                    <a th:href="@{/admin/log/login}" class="btn btn-outline-secondary" th:classappend="${loginStatus==-1} ? 'active'">全部</a>
                    <a th:href="@{/admin/log/login(loginStatus=1)}" class="btn btn-outline-success" th:classappend="${loginStatus==1} ? 'active'">成功</a>
                    <a th:href="@{/admin/log/login(loginStatus=0)}" class="btn btn-outline-danger" th:classappend="${loginStatus==0} ? 'active'">失败</a>
                </div>
                <span class="small text-muted">共 <b th:text="${total}"></b> 条</span>
            </div>
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>ID</th><th>用户名</th><th>类型</th><th>状态</th><th>失败原因</th>
                        <th>IP</th><th>时间</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="l : ${list}">
                        <td th:text="${l.id}"></td>
                        <td th:text="${l.username}"></td>
                        <td th:text="${l.userType == 1 ? '后台管理员' : '前台用户'}"></td>
                        <td>
                            <span class="badge" th:classappend="${l.loginStatus == 1} ? 'bg-success' : 'bg-danger'"
                                  th:text="${l.loginStatus == 1} ? '成功' : '失败'"></span>
                        </td>
                        <td th:text="${l.failReason}"></td>
                        <td th:text="${l.ipAddress}"></td>
                        <td th:text="${l.createTime != null} ? ${#temporals.format(l.createTime,'yyyy-MM-dd HH:mm:ss')} : ''"></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(list)}">
                        <td colspan="7" class="text-center text-muted py-4">暂无登录日志</td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <div class="card-footer" th:if="${totalPage > 1}">
                <nav><ul class="pagination pagination-sm mb-0">
                    <li class="page-item" th:if="${page > 1}">
                        <a class="page-link" th:href="@{/admin/log/login(loginStatus=${loginStatus==-1 ? null : loginStatus}, page=${page-1})}">上一页</a></li>
                    <li class="page-item disabled"><a class="page-link" th:text="'第 ' + ${page} + ' / ' + ${totalPage} + ' 页'"></a></li>
                    <li class="page-item" th:if="${page < totalPage}">
                        <a class="page-link" th:href="@{/admin/log/login(loginStatus=${loginStatus==-1 ? null : loginStatus}, page=${page+1})}">下一页</a></li>
                </ul></nav>
            </div>
        </div>
    </div>
</div>
</body>
</html>
