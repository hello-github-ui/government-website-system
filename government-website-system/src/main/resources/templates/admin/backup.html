<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/layout :: head(title='数据备份')}"></head>
<body>
<div th:insert="~{admin/fragments/layout :: aside}"></div>
<div class="admin-main">
    <div th:insert="~{admin/fragments/layout :: topbar(title='数据备份')}"></div>
    <div class="admin-content">
        <div class="card shadow-sm mb-3">
            <div class="card-body d-flex justify-content-between align-items-center flex-wrap gap-2">
                <div>
                    <h6 class="mb-1"><i class="fas fa-database"></i> 数据库备份</h6>
                    <p class="text-muted small mb-0">将数据库全量导出为 SQL 文件，备份文件保存在服务器 backup 目录。</p>
                </div>
                <form autocomplete="off" th:action="@{/admin/backup/create}" method="post">
                    <button class="btn btn-danger"><i class="fas fa-plus-circle"></i> 立即备份</button>
                </form>
            </div>
        </div>

        <div class="card shadow-sm mb-3">
            <div class="card-header bg-white"><i class="fas fa-upload"></i> 恢复数据库（危险操作）</div>
            <div class="card-body">
                <div class="alert alert-warning small mb-3">
                    <i class="fas fa-exclamation-triangle"></i>
                    恢复会<strong>覆盖当前数据库中的表结构与数据</strong>，请务必先创建最新备份，并确认上传的是完整可用的 SQL 文件。
                </div>
                <form autocomplete="off" th:action="@{/admin/backup/restore}" method="post" enctype="multipart/form-data"
                      onsubmit="return confirm('确定要执行恢复吗？此操作会覆盖现有数据，不可撤销！');">
                    <div class="d-flex">
                        <input autocomplete="off" type="file" name="file" class="form-control me-2" accept=".sql" required>
                        <button class="btn btn-warning">执行恢复</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-header bg-white d-flex justify-content-between align-items-center">
                <span><i class="fas fa-folder-open"></i> 备份文件列表</span>
                <span class="text-muted small">共 <b th:text="${#lists.size(files)}"></b> 个</span>
            </div>
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr><th>文件名</th><th>大小</th><th>生成时间</th><th class="text-end">操作</th></tr>
                    </thead>
                    <tbody>
                    <tr th:each="f : ${files}">
                        <td><i class="fas fa-file-code text-success me-1"></i><span th:text="${f.name}"></span></td>
                        <td th:text="${f.sizeText}"></td>
                        <td th:text="${f.time}"></td>
                        <td class="text-end">
                            <a th:href="@{/admin/backup/download(filename=${f.name})}" class="btn btn-sm btn-outline-primary"><i class="fas fa-download"></i> 下载</a>
                            <form autocomplete="off" th:action="@{/admin/backup/delete}" method="post" class="d-inline" onsubmit="return confirm('确定删除该备份？')">
                                <input autocomplete="off" type="hidden" name="filename" th:value="${f.name}">
                                <button class="btn btn-sm btn-outline-danger"><i class="fas fa-trash"></i> 删除</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(files)}">
                        <td colspan="4" class="text-center text-muted py-4">暂无备份文件</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
