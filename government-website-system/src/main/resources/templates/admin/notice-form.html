<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/layout :: head(title='公告编辑')}"></head>
<body>
<div th:insert="~{admin/fragments/layout :: aside}"></div>
<div class="admin-main">
    <div th:insert="~{admin/fragments/layout :: topbar(title='公告编辑')}"></div>
    <div class="admin-content">
        <div class="card shadow-sm"><div class="card-body">
            <form autocomplete="off" th:action="${info != null} ? @{/admin/notice/edit/{id}(id=${info.id})} : @{/admin/notice/add}" method="post">
                <div class="mb-3"><label class="form-label">标题 *</label>
                    <input autocomplete="off" name="title" class="form-control" th:value="${info?.title}" required></div>
                <div class="mb-3"><label class="form-label">摘要</label>
                    <textarea name="summary" rows="2" class="form-control" th:text="${info?.summary}"></textarea></div>
                <div class="mb-3"><label class="form-label">内容</label>
                    <textarea name="content" rows="8" class="form-control" th:text="${info?.content}"></textarea></div>
                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label">发布状态</label>
                        <select name="status" class="form-select">
                            <option value="1" th:selected="${info == null || info.status == 1}">已发布</option>
                            <option value="0" th:selected="${info != null && info.status == 0}">草稿</option>
                        </select></div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">置顶</label>
                        <select name="isTop" class="form-select">
                            <option value="0" th:selected="${info == null || info.isTop == 0}">否</option>
                            <option value="1" th:selected="${info != null && info.isTop == 1}">是</option>
                        </select></div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">重要</label>
                        <select name="isImportant" class="form-select">
                            <option value="0" th:selected="${info == null || info.isImportant == 0}">否</option>
                            <option value="1" th:selected="${info != null && info.isImportant == 1}">是</option>
                        </select></div>
                </div>
                <button class="btn btn-danger">保存</button>
                <a th:href="@{/admin/notice}" class="btn btn-outline-secondary">返回</a>
            </form>
        </div></div>
    </div>
</div>
</body>
</html>
