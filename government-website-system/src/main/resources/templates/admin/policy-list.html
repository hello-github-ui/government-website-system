<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/layout :: head(title='政策法规')}"></head>
<body>
<div th:insert="~{admin/fragments/layout :: aside}"></div>
<div class="admin-main">
    <div th:insert="~{admin/fragments/layout :: topbar(title='政策法规')}"></div>
    <div class="admin-content">
        <div class="card shadow-sm">
            <div class="card-header bg-white d-flex justify-content-between">
                <span>政策列表（共 <b th:text="${total}"></b> 条）</span>
                <a th:href="@{/admin/policy/add}" class="btn btn-danger btn-sm"><i class="fas fa-plus"></i> 新增政策</a>
            </div>
            <table class="table table-hover mb-0">
                <thead class="table-light"><tr><th>ID</th><th>标题</th><th>发布机构</th><th>发布日期</th><th>操作</th></tr></thead>
                <tbody>
                <tr th:each="p : ${list}">
                    <td th:text="${p.id}"></td>
                    <td th:text="${p.title}"></td>
                    <td th:text="${p.publishOrg}"></td>
                    <td th:text="${p.publishDate != null} ? ${#temporals.format(p.publishDate,'yyyy-MM-dd')} : '-'"></td>
                    <td>
                        <a th:href="@{/admin/policy/edit/{id}(id=${p.id})}" class="btn btn-sm btn-outline-primary">编辑</a>
                        <form autocomplete="off" th:action="@{/admin/policy/delete}" method="post" style="display:inline" onsubmit="return confirm('确认删除？')">
                            <input autocomplete="off" type="hidden" name="id" th:value="${p.id}">
                            <button class="btn btn-sm btn-outline-danger">删除</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(list)}"><td colspan="5" class="text-center text-muted py-4">暂无数据</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
