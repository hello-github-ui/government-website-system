<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/layout :: head(title='政策编辑')}"></head>
<body>
<div th:insert="~{admin/fragments/layout :: aside}"></div>
<div class="admin-main">
    <div th:insert="~{admin/fragments/layout :: topbar(title='政策编辑')}"></div>
    <div class="admin-content">
        <div th:if="${flashError != null}" class="alert alert-danger" th:text="${flashError}"></div>
        <div class="card shadow-sm"><div class="card-body">
            <form autocomplete="off" th:action="${info != null} ? @{/admin/policy/edit/{id}(id=${info.id})} : @{/admin/policy/add}"
                  method="post" enctype="multipart/form-data">
                <div class="mb-3"><label class="form-label">标题 *</label>
                    <input autocomplete="off" name="title" class="form-control" th:value="${info?.title}" required></div>
                <div class="row">
                    <div class="col-md-6 mb-3"><label class="form-label">发布机构</label>
                        <input autocomplete="off" name="publish_org" class="form-control" th:value="${info?.publishOrg}"></div>
                    <div class="col-md-6 mb-3"><label class="form-label">发布日期</label>
                        <input autocomplete="off" type="date" name="publish_date" class="form-control"
                               th:value="${info?.publishDate != null} ? ${#temporals.format(info.publishDate,'yyyy-MM-dd')} : ''"></div>
                </div>
                <div class="mb-3"><label class="form-label">内容</label>
                    <textarea name="content" rows="8" class="form-control" th:text="${info?.content}"></textarea></div>
                <div class="mb-3"><label class="form-label">附件</label>
                    <div th:if="${info?.attachment != null}" class="small mb-1">
                        当前附件：<a th:href="@{'/uploads/' + ${info.attachment}}" target="_blank" th:text="${info.attachment}"></a>
                        <span class="text-muted">（重新上传将覆盖）</span>
                    </div>
                    <input autocomplete="off" type="file" name="attachment" class="form-control"></div>
                <div class="mb-3"><label class="form-label">状态</label>
                    <select name="status" class="form-select">
                        <option value="1" th:selected="${info == null || info.status == 1}">已发布</option>
                        <option value="0" th:selected="${info != null && info.status == 0}">草稿</option>
                    </select></div>
                <button class="btn btn-danger">保存</button>
                <a th:href="@{/admin/policy}" class="btn btn-outline-secondary">返回</a>
            </form>
        </div></div>
    </div>
</div>
</body>
</html>
