<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/layout :: head(title='公告管理')}"></head>
<body>
<div th:insert="~{admin/fragments/layout :: aside}"></div>
<div class="admin-main">
    <div th:insert="~{admin/fragments/layout :: topbar(title='公告管理')}"></div>
    <div class="admin-content">
        <div class="card shadow-sm">
            <div class="card-header bg-white d-flex justify-content-between">
                <span>公告列表（共 <b th:text="${total}"></b> 条）</span>
                <a th:href="@{/admin/notice/add}" class="btn btn-danger btn-sm"><i class="fas fa-plus"></i> 新增公告</a>
            </div>
            <table class="table table-hover mb-0">
                <thead class="table-light"><tr><th>ID</th><th>标题</th><th>状态</th><th>发布时间</th><th>操作</th></tr></thead>
                <tbody>
                <tr th:each="n : ${list}">
                    <td th:text="${n.id}"></td>
                    <td>
                        <span th:if="${n.isTop==1}" class="badge bg-danger">置顶</span>
                        <span th:text="${n.title}"></span>
                    </td>
                    <td>
                        <span th:if="${n.status==1}" class="badge bg-success">已发布</span>
                        <span th:if="${n.status==0}" class="badge bg-secondary">草稿</span>
                    </td>
                    <td th:text="${#temporals.format(n.publishTime,'yyyy-MM-dd')}"></td>
                    <td>
                        <a th:href="@{/admin/notice/edit/{id}(id=${n.id})}" class="btn btn-sm btn-outline-primary">编辑</a>
                        <form autocomplete="off" th:action="@{/admin/notice/delete}" method="post" style="display:inline"
                              onsubmit="return confirm('确认删除？')">
                            <input autocomplete="off" type="hidden" name="id" th:value="${n.id}">
                            <button class="btn btn-sm btn-outline-danger">删除</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(list)}"><td colspan="5" class="text-center text-muted py-4">暂无数据</td></tr>
                </tbody>
            </table>
            <div class="card-footer">
                <nav><ul class="pagination pagination-sm mb-0">
                    <li class="page-item" th:if="${page > 1}"><a class="page-link" th:href="@{/admin/notice(page=${page-1})}">上一页</a></li>
                    <li class="page-item disabled"><a class="page-link" th:text="'第 ' + ${page} + ' / ' + ${totalPage} + ' 页'"></a></li>
                    <li class="page-item" th:if="${page < totalPage}"><a class="page-link" th:href="@{/admin/notice(page=${page+1})}">下一页</a></li>
                </ul></nav>
            </div>
        </div>
    </div>
</div>
</body>
</html>
