<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{home/fragments/header :: head}"></head>
<body>
<header th:replace="~{home/fragments/header :: top}"></header>
<div class="container py-4">
    <h4 class="mb-3"><i class="fas fa-gavel text-danger"></i> 裁判文书检索</h4>
    <form autocomplete="off" th:action="@{/judicial}" method="get" class="mb-3">
        <div class="input-group">
            <input autocomplete="off" type="text" name="keyword" class="form-control" th:value="${keyword}"
                   placeholder="请输入案件名称、案号或关键词">
            <button class="btn btn-danger">检索</button>
        </div>
    </form>
    <div th:if="${isSearch}" class="alert alert-light small">
        关键词 “<span th:text="${keyword}"></span>” 共找到 <span th:text="${total}"></span> 条结果
    </div>
    <div class="list-group shadow-sm">
        <div th:each="j : ${judicials}" class="list-group-item">
            <a th:href="@{/judicial/detail/{id}(id=${j.id})}" class="fw-semibold text-decoration-none" th:text="${j.caseName}">案件</a>
            <div class="small text-muted">
                案号：<span th:text="${j.caseNo}"></span> ·
                法院：<span th:text="${j.court}"></span> ·
                裁判日期：<span th:text="${#temporals.format(j.judgeDate,'yyyy-MM-dd')}"></span>
            </div>
        </div>
        <div th:if="${#lists.isEmpty(judicials)}" class="list-group-item text-center text-muted py-5">未找到相关文书</div>
    </div>
    <nav class="pagination-wrap">
        <ul class="pagination">
            <li class="page-item" th:if="${page > 1}"><a class="page-link" th:href="@{/judicial(keyword=${keyword},page=${page-1})}">上一页</a></li>
            <li class="page-item disabled"><a class="page-link" th:text="'第 ' + ${page} + ' / ' + ${totalPages} + ' 页'"></a></li>
            <li class="page-item" th:if="${page < totalPages}"><a class="page-link" th:href="@{/judicial(keyword=${keyword},page=${page+1})}">下一页</a></li>
        </ul>
    </nav>
</div>
<footer th:replace="~{home/fragments/footer :: body}"></footer>
</body>
</html>
