<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{home/fragments/header :: head}"></head>
<body>
<header th:replace="~{home/fragments/header :: top}"></header>
<div class="container py-4">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h3 class="text-center" th:text="${notice.title}">标题</h3>
            <p class="text-center text-muted small">
                发布时间：<span th:text="${#temporals.format(notice.publishTime,'yyyy-MM-dd HH:mm')}"></span>
                &nbsp; 浏览：<span th:text="${notice.views}"></span>
            </p>
            <hr>
            <div class="detail-content" th:utext="${notice.content}">内容</div>
        </div>
    </div>
    <a th:href="@{/notice}" class="btn btn-outline-secondary mt-3"><i class="fas fa-arrow-left"></i> 返回列表</a>
</div>
<footer th:replace="~{home/fragments/footer :: body}"></footer>
</body>
</html>
