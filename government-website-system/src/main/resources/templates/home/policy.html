<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{home/fragments/header :: head}"></head>
<body>
<header th:replace="~{home/fragments/header :: top}"></header>
<div class="container py-4">
    <h4 class="mb-3"><i class="fas fa-file-alt text-danger"></i> 政策法规</h4>
    <div class="list-group shadow-sm">
        <a th:each="p : ${policies}" th:href="@{/policy/detail/{id}(id=${p.id})}"
           class="list-group-item list-group-item-action">
            <div class="fw-semibold" th:text="${p.title}">政策</div>
            <div class="small text-muted">
                <span th:text="${p.publishOrg}"></span> ·
                <span th:text="${#temporals.format(p.publishDate,'yyyy-MM-dd')}"></span>
            </div>
        </a>
        <div th:if="${#lists.isEmpty(policies)}" class="list-group-item text-center text-muted py-5">暂无政策</div>
    </div>
    <nav class="pagination-wrap">
        <ul class="pagination">
            <li class="page-item" th:if="${page > 1}"><a class="page-link" th:href="@{/policy(page=${page-1})}">上一页</a></li>
            <li class="page-item disabled"><a class="page-link" th:text="'第 ' + ${page} + ' / ' + ${totalPages} + ' 页'"></a></li>
            <li class="page-item" th:if="${page < totalPages}"><a class="page-link" th:href="@{/policy(page=${page+1})}">下一页</a></li>
        </ul>
    </nav>
</div>
<footer th:replace="~{home/fragments/footer :: body}"></footer>
</body>
</html>
