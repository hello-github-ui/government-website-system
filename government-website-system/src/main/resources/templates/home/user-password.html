<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{home/fragments/header :: head}"></head>
<body>
<header th:replace="~{home/fragments/header :: top}"></header>
<div class="container">
    <div class="form-signin" style="max-width:420px;">
        <div th:if="${flashError != null}" class="alert alert-danger" th:text="${flashError}"></div>
        <div th:if="${flashMessage != null}" class="alert alert-success" th:text="${flashMessage}"></div>
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h5 class="mb-3">修改密码</h5>
                <form autocomplete="off" th:action="@{/user/password}" method="post">
                    <div class="mb-3"><label class="form-label">原密码</label>
                        <input autocomplete="off" type="password" name="old_password" class="form-control" required></div>
                    <div class="mb-3"><label class="form-label">新密码</label>
                        <input autocomplete="off" type="password" name="new_password" class="form-control" required></div>
                    <div class="mb-3"><label class="form-label">确认新密码</label>
                        <input autocomplete="off" type="password" name="confirm_password" class="form-control" required></div>
                    <button class="btn btn-danger w-100">确认修改</button>
                </form>
            </div>
        </div>
    </div>
</div>
<footer th:replace="~{home/fragments/footer :: body}"></footer>
</body>
</html>
