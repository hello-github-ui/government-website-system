<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{home/fragments/header :: head}"></head>
<body>
<header th:replace="~{home/fragments/header :: top}"></header>
<div class="container py-4">
    <h4 class="mb-3">站内搜索</h4>
    <form autocomplete="off" th:action="@{/search}" method="get" class="mb-4">
        <div class="input-group">
            <input autocomplete="off" type="text" name="q" class="form-control" th:value="${keyword}" placeholder="输入关键词">
            <select name="type" class="form-select" style="max-width:120px;">
                <option value="all" th:selected="${type=='all'}">全部</option>
                <option value="notice" th:selected="${type=='notice'}">公告</option>
                <option value="policy" th:selected="${type=='policy'}">政策</option>
                <option value="judicial" th:selected="${type=='judicial'}">文书</option>
            </select>
            <button class="btn btn-danger">搜索</button>
        </div>
    </form>

    <div th:if="${#strings.isEmpty(keyword)}" class="text-center text-muted py-5">请输入关键词开始搜索</div>

    <div th:if="${noticeResult != null}" class="mb-4">
        <h6 class="text-danger">公告 (<span th:text="${noticeResult.total}"></span>)</h6>
        <div class="list-group">
            <a th:each="n : ${noticeResult.list}" th:href="@{/notice/detail/{id}(id=${n.id})}"
               class="list-group-item list-group-item-action" th:text="${n.title}"></a>
        </div>
    </div>
    <div th:if="${policyResult != null}" class="mb-4">
        <h6 class="text-danger">政策法规 (<span th:text="${policyResult.total}"></span>)</h6>
        <div class="list-group">
            <a th:each="p : ${policyResult.list}" th:href="@{/policy/detail/{id}(id=${p.id})}"
               class="list-group-item list-group-item-action" th:text="${p.title}"></a>
        </div>
    </div>
    <div th:if="${judicialResult != null}" class="mb-4">
        <h6 class="text-danger">裁判文书 (<span th:text="${judicialResult.total}"></span>)</h6>
        <div class="list-group">
            <a th:each="j : ${judicialResult.list}" th:href="@{/judicial/detail/{id}(id=${j.id})}"
               class="list-group-item list-group-item-action" th:text="${j.caseName}"></a>
        </div>
    </div>
</div>
<footer th:replace="~{home/fragments/footer :: body}"></footer>
</body>
</html>
