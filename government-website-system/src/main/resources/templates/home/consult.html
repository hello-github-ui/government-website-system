<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{home/fragments/header :: head}"></head>
<body>
<header th:replace="~{home/fragments/header :: top}"></header>
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4><i class="fas fa-comments text-danger"></i> 咨询投诉</h4>
        <a th:href="@{/consult/submit}" class="btn btn-danger btn-sm"><i class="fas fa-plus"></i> 我要咨询</a>
    </div>
    <div class="list-group shadow-sm">
        <div th:each="c : ${consults}" class="list-group-item">
            <a th:href="@{/consult/detail/{id}(id=${c.id})}" class="fw-semibold text-decoration-none" th:text="${c.title}"></a>
            <div class="small text-muted" th:text="'回复时间：' + ${#temporals.format(c.replyTime,'yyyy-MM-dd')}"></div>
        </div>
        <div th:if="${#lists.isEmpty(consults)}" class="list-group-item text-center text-muted py-5">暂无公开咨询</div>
    </div>
</div>
<footer th:replace="~{home/fragments/footer :: body}"></footer>
</body>
</html>
