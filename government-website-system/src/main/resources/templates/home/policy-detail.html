<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{home/fragments/header :: head}"></head>
<body>
<header th:replace="~{home/fragments/header :: top}"></header>
<div class="container py-4">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h3 th:text="${policy.title}">政策标题</h3>
            <p class="text-muted small">
                发布机构：<span th:text="${policy.publishOrg}"></span> ·
                发布日期：<span th:text="${#temporals.format(policy.publishDate,'yyyy-MM-dd')}"></span>
            </p>
            <hr>
            <div class="detail-content" th:utext="${policy.content}">内容</div>
            <div th:if="${policy.attachment != null && !#strings.isEmpty(policy.attachment)}" class="mt-3 p-3 bg-light rounded">
                <i class="fas fa-paperclip text-danger"></i> 附件下载：
                <a th:href="@{'/uploads/' + ${policy.attachment}}" target="_blank" class="text-decoration-none"
                   th:text="${policy.attachment}">附件</a>
            </div>
        </div>
    </div>
    <a th:href="@{/policy}" class="btn btn-outline-secondary mt-3"><i class="fas fa-arrow-left"></i> 返回列表</a>
</div>
<footer th:replace="~{home/fragments/footer :: body}"></footer>
</body>
</html>
