<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{home/fragments/header :: head}"></head>
<body>
<header th:replace="~{home/fragments/header :: top}"></header>
<div class="container py-4">
    <h4 class="mb-3">我的咨询</h4>
    <table class="table table-striped bg-white shadow-sm">
        <thead><tr><th>标题</th><th>状态</th><th>提交时间</th><th></th></tr></thead>
        <tbody>
        <tr th:each="c : ${consults}">
            <td th:text="${c.title}"></td>
            <td>
                <span th:if="${c.status==0}" class="badge bg-secondary">待处理</span>
                <span th:if="${c.status==1}" class="badge bg-info">处理中</span>
                <span th:if="${c.status==2}" class="badge bg-success">已回复</span>
                <span th:if="${c.status==3}" class="badge bg-dark">已关闭</span>
            </td>
            <td th:text="${#temporals.format(c.createTime,'yyyy-MM-dd')}"></td>
            <td><a th:href="@{/consult/detail/{id}(id=${c.id})}" class="btn btn-sm btn-outline-primary">查看</a></td>
        </tr>
        <tr th:if="${#lists.isEmpty(consults)}"><td colspan="4" class="text-center text-muted py-4">暂无记录</td></tr>
        </tbody>
    </table>
</div>
<footer th:replace="~{home/fragments/footer :: body}"></footer>
</body>
</html>
