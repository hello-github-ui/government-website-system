<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{home/fragments/header :: head}"></head>
<body>
<header th:replace="~{home/fragments/header :: top}"></header>
<div class="container py-4">
    <h4 class="mb-3"><i class="fas fa-bullhorn text-danger"></i> 政务公告</h4>
    <div class="list-group shadow-sm">
        <a th:each="n : ${notices}" th:href="@{/notice/detail/{id}(id=${n.id})}"
           class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
            <span>
                <span th:if="${n.isTop == 1}" class="badge bg-danger me-1">置顶</span>
                <span th:if="${n.isImportant == 1}" class="badge bg-warning text-dark me-1">重要</span>
                <span th:text="${n.title}"></span>
                <div class="small text-muted" th:text="${n.summary}"></div>
            </span>
            <small class="text-muted" th:text="${#temporals.format(n.publishTime,'yyyy-MM-dd')}">日期</small>
        </a>
        <div th:if="${#lists.isEmpty(notices)}" class="list-group-item text-center text-muted py-5">暂无公告</div>
    </div>
    <nav class="pagination-wrap">
        <ul class="pagination">
            <li class="page-item" th:if="${page > 1}"><a class="page-link" th:href="@{/notice(page=${page-1})}">上一页</a></li>
            <li class="page-item disabled"><a class="page-link" th:text="'第 ' + ${page} + ' / ' + ${totalPages} + ' 页'">1/1</a></li>
            <li class="page-item" th:if="${page < totalPages}"><a class="page-link" th:href="@{/notice(page=${page+1})}">下一页</a></li>
        </ul>
    </nav>
</div>
<footer th:replace="~{home/fragments/footer :: body}"></footer>
</body>
</html>
