<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{home/fragments/header :: head}"></head>
<body>
<header th:replace="~{home/fragments/header :: top}"></header>
<div class="container">
    <div class="form-signin" style="max-width:480px;">
        <div th:if="${flashError != null}" class="alert alert-danger" th:text="${flashError}"></div>
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h4 class="text-center mb-4"><i class="fas fa-user-plus text-danger"></i> 用户注册</h4>
                <form th:action="@{/register/doRegister}" method="post">
                    <div class="mb-3"><label class="form-label">用户名</label>
                        <input name="username" class="form-control" required></div>
                    <div class="mb-3"><label class="form-label">真实姓名</label>
                        <input name="real_name" class="form-control"></div>
                    <div class="mb-3"><label class="form-label">手机号</label>
                        <input name="phone" class="form-control"></div>
                    <div class="mb-3"><label class="form-label">邮箱</label>
                        <input type="email" name="email" class="form-control"></div>
                    <div class="mb-3"><label class="form-label">密码</label>
                        <input type="password" name="password" class="form-control" required></div>
                    <div class="mb-3"><label class="form-label">确认密码</label>
                        <input type="password" name="confirm_password" class="form-control" required></div>
                    <button class="btn btn-danger w-100">注 册</button>
                </form>
                <div class="mt-3 text-center small">已有账号？<a th:href="@{/login}">去登录</a></div>
            </div>
        </div>
    </div>
</div>
<footer th:replace="~{home/fragments/footer :: body}"></footer>
</body>
</html>
