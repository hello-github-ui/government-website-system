<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- 前台页脚片段 -->
<div th:fragment="body">
    <footer class="main-footer mt-5 py-4 bg-dark text-light">
        <div class="container">
            <div class="row g-4">
                <div class="col-md-5">
                    <h6 class="text-white"><i class="fas fa-landmark me-2"></i>
                        <span th:text="${siteConfig['site_title']} ?: '政府官网'">政府官网</span></h6>
                    <p class="small text-secondary" th:text="${siteConfig['site_subtitle']} ?: '政务服务门户网站'">副标题</p>
                </div>
                <div class="col-md-3">
                    <h6 class="text-white">快速链接</h6>
                    <ul class="list-unstyled small">
                        <li><a th:href="@{/notice}" class="text-secondary text-decoration-none">政务公开</a></li>
                        <li><a th:href="@{/policy}" class="text-secondary text-decoration-none">政策法规</a></li>
                        <li><a th:href="@{/judicial}" class="text-secondary text-decoration-none">裁判文书</a></li>
                        <li><a th:href="@{/contact}" class="text-secondary text-decoration-none">联系我们</a></li>
                    </ul>
                </div>
                <div class="col-md-4">
                    <h6 class="text-white">联系方式</h6>
                    <ul class="list-unstyled small text-secondary">
                        <li><i class="fas fa-map-marker-alt"></i> <span th:text="${siteConfig['contact_address']} ?: ''"></span></li>
                        <li><i class="fas fa-phone"></i> <span th:text="${siteConfig['contact_phone']} ?: ''"></span></li>
                        <li><i class="fas fa-clock"></i> <span th:text="${siteConfig['contact_work_time']} ?: ''"></span></li>
                    </ul>
                </div>
            </div>
            <hr class="bg-secondary">
            <div class="d-flex justify-content-between small text-secondary">
                <span th:text="${siteConfig['copyright']} ?: ''">© 2026 版权所有</span>
                <span th:text="${siteConfig['icp_number']} ?: ''"></span>
            </div>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</div>
</body>
</html>
