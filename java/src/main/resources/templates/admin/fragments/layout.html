<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
<!-- 后台公共 <head>：传入页面标题 -->
<th:block th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">管理后台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background:#f1f3f5; }
        .admin-sidebar { width:230px; background:#212529; min-height:100vh; position:fixed; top:0; left:0; overflow-y:auto; }
        .admin-sidebar .brand { color:#fff; padding:16px 20px; font-weight:700; border-bottom:1px solid #343a40; }
        .admin-sidebar a { color:#adb5bd; display:block; padding:10px 20px; text-decoration:none; font-size:14px; }
        .admin-sidebar a:hover { color:#fff; background:#b91c1c; }
        .admin-sidebar .section { color:#6c757d; font-size:12px; padding:12px 20px 4px; }
        .admin-main { margin-left:230px; }
        .admin-topbar { background:#fff; padding:10px 20px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
        .admin-content { padding:20px; }
    </style>
</th:block>
</head>
<body>
<!-- 侧边栏 -->
<aside class="admin-sidebar" th:fragment="aside">
    <div class="brand"><i class="fas fa-landmark"></i> 政府官网后台</div>
    <a th:href="@{/admin}"><i class="fas fa-tachometer-alt"></i> 控制台</a>
    <div class="section">内容管理</div>
    <a th:href="@{/admin/notice}"><i class="fas fa-bullhorn"></i> 公告管理</a>
    <a th:href="@{/admin/policy}"><i class="fas fa-file-alt"></i> 政策法规</a>
    <a th:href="@{/admin/judicial}"><i class="fas fa-gavel"></i> 裁判文书</a>
    <div class="section">互动管理</div>
    <a th:href="@{/admin/consult}"><i class="fas fa-comments"></i> 咨询管理</a>
    <a th:href="@{/admin/user}"><i class="fas fa-users"></i> 前台用户</a>
    <div class="section">系统管理</div>
    <a th:href="@{/admin/admin}"><i class="fas fa-user-shield"></i> 管理员</a>
    <a th:href="@{/admin/role}"><i class="fas fa-user-tag"></i> 角色权限</a>
    <a th:href="@{/admin/nav}"><i class="fas fa-sitemap"></i> 导航管理</a>
    <a th:href="@{/admin/media}"><i class="fas fa-photo-film"></i> 媒体库</a>
    <a th:href="@{/admin/language}"><i class="fas fa-language"></i> 文字配置</a>
    <a th:href="@{/admin/log}"><i class="fas fa-list"></i> 操作日志</a>
    <a th:href="@{/admin/settings}"><i class="fas fa-cog"></i> 系统设置</a>
    <div class="section">其他</div>
    <a th:href="@{/}" target="_blank"><i class="fas fa-eye"></i> 查看前台</a>
    <a th:href="@{/admin/logout}"><i class="fas fa-sign-out-alt"></i> 退出登录</a>
</aside>

<!-- 顶栏 -->
<div class="admin-topbar" th:fragment="topbar(title)">
    <div class="d-flex justify-content-between align-items-center">
        <div th:text="${title}">管理后台</div>
        <div>
            <span class="small text-muted" th:if="${admin != null}">欢迎，<span th:text="${admin.name} ?: ${admin.username}"></span></span>
        </div>
    </div>
</div>
</body>
</html>
