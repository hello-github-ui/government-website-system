<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/layout :: head(title='导航管理')}"></head>
<body>
<div th:insert="~{admin/fragments/layout :: aside}"></div>
<div class="admin-main">
    <div th:insert="~{admin/fragments/layout :: topbar(title='导航管理')}"></div>
    <div class="admin-content">
        <div class="card shadow-sm">
            <div class="card-header bg-white d-flex justify-content-between">
                <span>导航列表</span>
                <a th:href="@{/admin/nav/add}" class="btn btn-danger btn-sm"><i class="fas fa-plus"></i> 添加导航</a>
            </div>
            <table class="table table-hover mb-0">
                <thead class="table-light"><tr><th>ID</th><th>名称</th><th>链接</th><th>排序</th><th>显示</th><th>操作</th></tr></thead>
                <tbody>
                <tr th:each="n : ${navs}">
                    <td th:text="${n.id}"></td>
                    <td th:text="${n.navName}"></td>
                    <td th:text="${n.navUrl}"></td>
                    <td th:text="${n.sort}"></td>
                    <td>
                        <span th:if="${n.isShow==1}" class="badge bg-success">显示</span>
                        <span th:if="${n.isShow==0}" class="badge bg-secondary">隐藏</span>
                    </td>
                    <td>
                        <a th:href="@{/admin/nav/edit/{id}(id=${n.id})}" class="btn btn-sm btn-outline-primary">编辑</a>
                        <form th:action="@{/admin/nav/delete}" method="post" style="display:inline" onsubmit="return confirm('确认删除？')">
                            <input type="hidden" name="id" th:value="${n.id}">
                            <button class="btn btn-sm btn-outline-danger">删除</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(navs)}"><td colspan="6" class="text-center text-muted py-4">暂无导航</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
