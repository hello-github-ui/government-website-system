<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/layout :: head(title='媒体库')}"></head>
<body>
<div th:insert="~{admin/fragments/layout :: aside}"></div>
<div class="admin-main">
    <div th:insert="~{admin/fragments/layout :: topbar(title='媒体库')}"></div>
    <div class="admin-content">
        <div class="card shadow-sm mb-3"><div class="card-body">
            <form th:action="@{/admin/media/upload}" method="post" enctype="multipart/form-data" class="d-flex">
                <input type="file" name="file" class="form-control me-2" required>
                <button class="btn btn-danger">上传</button>
            </form>
        </div></div>
        <div class="card shadow-sm"><div class="card-body">
            <div class="row g-3">
                <div class="col-md-3 text-center" th:each="f : ${list}">
                    <div class="border rounded p-2">
                        <i class="fas fa-file fa-2x text-secondary"></i>
                        <div class="small text-truncate" th:text="${f.name}"></div>
                        <div class="text-muted small" th:text="${f.size / 1024} + ' KB'"></div>
                        <form th:action="@{/admin/media/delete}" method="post" onsubmit="return confirm('删除？')">
                            <input type="hidden" name="filename" th:value="${f.name}">
                            <button class="btn btn-sm btn-outline-danger mt-1">删除</button>
                        </form>
                    </div>
                </div>
                <div th:if="${#lists.isEmpty(list)}" class="text-center text-muted py-4">暂无文件</div>
            </div>
        </div></div>
    </div>
</div>
</body>
</html>
